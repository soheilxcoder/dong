name: Build static site for Plesk (repo root)

# Builds the web app for https://dong.arounidea.com/ and commits the
# result into the root of the SAME branch, so a Plesk "Git" repository can
# simply pull this branch and serve it — no Node.js needed on the host.

on:
  push:
    branches: ['**']
    paths-ignore:
      - 'deploy/**'
      - 'docs/**'
      - 'store-assets/**'
      - 'docs-src/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: plesk-${{ github.ref }}
  cancel-in-progress: true

env:
  SITE_URL: https://dong.arounidea.com/
  BASE_PATH: /

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip plesk]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build web
        run: npm run build -w @dong/web
        env:
          VITE_BASE: ${{ env.BASE_PATH }}
          VITE_PUBLIC_URL: ${{ env.SITE_URL }}
          VITE_RT_URL: ${{ vars.RT_URL }}
      # The built site lives at the REPO ROOT (Plesk deploys the repo straight into the document root and
      # nginx serves static files without consulting .htaccess, so no rewrite tricks are possible).
      # DEPLOYED_FILES.txt remembers what was copied last time so stale build files are removed first.
      - name: Stage build into repo root
        run: |
          rm -rf deploy
          if [ -f DEPLOYED_FILES.txt ]; then while read -r f; do [ -n "$f" ] && rm -rf -- "$f"; done < DEPLOYED_FILES.txt; fi
          cp apps/web/dist/index.html apps/web/dist/404.html
          echo "${{ github.sha }}" > apps/web/dist/BUILD.txt
          date -u +%Y-%m-%dT%H:%M:%SZ >> apps/web/dist/BUILD.txt
          (cd apps/web/dist && ls -A) > DEPLOYED_FILES.txt
          cp -r apps/web/dist/. ./
      - name: Commit & push
        run: |
          set -x
          trap 'echo "::error title=commit-push::failed at line $LINENO"' ERR
          git status --short | head -30
          git config user.name  "dong-bot"
          git config user.email "dong-bot@users.noreply.github.com"
          git add -A -- . ':!apps' ':!node_modules'
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "deploy(plesk): static build ${GITHUB_SHA::7} [skip plesk] [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}" 2>&1 | tail -5 || { git rebase --abort || true; echo "::warning::rebase failed"; }
          git push origin "HEAD:${GITHUB_REF_NAME}" 2>&1 | tail -5 | sed 's/^/::notice title=push::/'
          git log --oneline -1
