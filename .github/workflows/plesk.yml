name: Build static site for Plesk (branch plesk-web)

# Builds the web app for https://products.arounidea.com/dong/ and force-pushes it as ONE commit to
# the `plesk-web` branch (site files + api/ + .htaccess). The Plesk "Git" repository pulls that branch
# into httpdocs/dong — tiny clone, no history growth, no Node.js needed on the host.

on:
  push:
    branches: ['**']
    paths-ignore:
      - 'deploy/**'
      - 'docs/**'
      - 'store-assets/**'
      - 'docs-src/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: plesk-${{ github.ref }}
  cancel-in-progress: true

env:
  SITE_URL: https://products.arounidea.com/dong/
  BASE_PATH: /dong/

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip plesk]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build web
        run: npm run build -w @dong/web
        env:
          VITE_BASE: ${{ env.BASE_PATH }}
          VITE_PUBLIC_URL: ${{ env.SITE_URL }}
          VITE_RT_URL: ${{ vars.RT_URL }}
      - name: Publish single-commit branch `plesk-web` (what the host pulls into /dong)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          rm -rf /tmp/site && mkdir -p /tmp/site && cd /tmp/site
          git init -q -b plesk-web
          cp -r "$GITHUB_WORKSPACE/apps/web/dist/." .
          cp index.html 404.html
          cp -r "$GITHUB_WORKSPACE/api" ./api && rm -rf ./api/data
          cp "$GITHUB_WORKSPACE/deploy/plesk-web.htaccess" ./.htaccess
          echo "${GITHUB_SHA}" > BUILD.txt && date -u +%Y-%m-%dT%H:%M:%SZ >> BUILD.txt
          git config user.name "dong-bot" && git config user.email "dong-bot@users.noreply.github.com"
          git add -A && git commit -qm "site build ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:plesk-web
          du -sh .git
