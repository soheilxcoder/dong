name: Build static site for Plesk (deploy/dong)

# Builds the web app for https://products.arounidea.com/dong/ and commits the
# result into deploy/dong/ on the SAME branch, so a Plesk "Git" repository can
# simply pull this branch and serve it — no Node.js needed on the host.

on:
  push:
    branches: ['**']
    paths-ignore:
      - 'deploy/**'
      - 'store-assets/**'
      - 'docs-src/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: plesk-${{ github.ref }}
  cancel-in-progress: true

env:
  SITE_URL: https://products.arounidea.com/dong/
  BASE_PATH: /dong/

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip plesk]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build web
        run: npm run build -w @dong/web
        env:
          VITE_BASE: ${{ env.BASE_PATH }}
          VITE_PUBLIC_URL: ${{ env.SITE_URL }}
      - name: Stage into deploy/dong
        run: |
          rm -rf deploy/dong && mkdir -p deploy/dong
          cp -r apps/web/dist/. deploy/dong/
          cp apps/web/dist/index.html deploy/dong/404.html
          echo "${{ github.sha }}" > deploy/dong/BUILD.txt
          date -u +%Y-%m-%dT%H:%M:%SZ >> deploy/dong/BUILD.txt
      - name: Commit & push
        run: |
          git config user.name  "dong-bot"
          git config user.email "dong-bot@users.noreply.github.com"
          git add -A deploy/dong
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "deploy(plesk): static build ${GITHUB_SHA::7} [skip plesk] [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
