name: Android APK

on:
  push:
    branches: [main, 'arena/**']
    paths: ['apps/**', 'packages/**', 'package*.json', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Android SDK (preinstalled on runner)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools" >/dev/null

      - run: npm ci
      - name: Version
        run: |
          echo "VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> $GITHUB_ENV
          echo "VERSION_NAME=1.$((GITHUB_RUN_NUMBER / 100)).$((GITHUB_RUN_NUMBER % 100))" >> $GITHUB_ENV
      - name: Build web (native build – root base)
        run: npm run build
        env:
          VITE_BASE: /
          VITE_PUBLIC_URL: https://soheilxcoder.github.io/dong/
          VITE_APP_VERSION: ${{ env.VERSION_NAME }}
          # Real AdMob unit ids come from repo secrets; without them Google TEST ads are used.
          VITE_ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
          VITE_ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
      - name: Capacitor sync
        run: npx cap sync android
        working-directory: apps/web

      # Signing: uses repo secrets if present (Play Store), otherwise a stable debug-style key
      - name: Prepare keystore
        working-directory: apps/web/android
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > release.keystore
            echo "KS_PASS=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASS=${{ secrets.ANDROID_KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            keytool -genkeypair -v -keystore release.keystore -alias dong -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass dong-dev-pass -keypass dong-dev-pass -dname "CN=Dong, O=Dong, C=IR"
            echo "KS_PASS=dong-dev-pass" >> $GITHUB_ENV
            echo "KEY_ALIAS=dong" >> $GITHUB_ENV
            echo "KEY_PASS=dong-dev-pass" >> $GITHUB_ENV
          fi
      - name: Build release APK + AAB
        working-directory: apps/web/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon \
            -PDONG_KEYSTORE=$PWD/release.keystore -PDONG_KS_PASS=$KS_PASS -PDONG_KEY_ALIAS=$KEY_ALIAS -PDONG_KEY_PASS=$KEY_PASS \
            -PDONG_VERSION_CODE=$VERSION_CODE -PDONG_VERSION_NAME=$VERSION_NAME \
            -PADMOB_APP_ID="${{ secrets.ADMOB_APP_ID || 'ca-app-pub-3940256099942544~3347511713' }}"
          echo "SIGNING=$([ -n '${{ secrets.ANDROID_KEYSTORE_B64 }}' ] && echo 'کلید آپلود شما (Play-ready)' || echo 'کلید موقت (فقط تست — برای Play باید secrets را تنظیم کنید)')" >> $GITHUB_ENV
          echo "ADS=$([ -n '${{ secrets.ADMOB_APP_ID }}' ] && echo 'AdMob واقعی' || echo 'تبلیغات تستی گوگل')" >> $GITHUB_ENV
          cp app/build/outputs/apk/release/app-release.apk ../../../dong-latest.apk
          cp app/build/outputs/bundle/release/app-release.aab ../../../dong-latest.aab
          cp app/build/outputs/apk/release/app-release.apk ../../../dong-${GITHUB_SHA::7}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: dong-android
          path: |
            dong-latest.apk
            dong-latest.aab

      - name: Clean previous release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for a in $(gh release view apk-latest --json assets --jq '.assets[].name' 2>/dev/null); do gh release delete-asset apk-latest "$a" -y || true; done
      - name: Publish "latest" release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: دُنگ — آخرین نسخه اندروید
          body: |
            نصب مستقیم: فایل `dong-latest.apk` را دانلود و نصب کنید (نصب از منابع ناشناس را اجازه دهید).
            برای Google Play فایل `dong-latest.aab` را آپلود کنید.

            - نسخه: `${{ env.VERSION_NAME }}` (versionCode `${{ env.VERSION_CODE }}`)
            - امضا: ${{ env.SIGNING }}
            - تبلیغات: ${{ env.ADS }}
            - نسخه وب: https://soheilxcoder.github.io/dong/
            - Commit: ${{ github.sha }}
          prerelease: true
          files: |
            dong-latest.apk
            dong-latest.aab
            dong-*.apk
