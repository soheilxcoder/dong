name: Android APK

on:
  push:
    branches: [main, 'arena/**']
    paths: ['apps/**', 'packages/**', 'package*.json', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Android SDK (preinstalled on runner)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools" >/dev/null

      - run: npm ci
      - name: Version
        run: |
          echo "VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> $GITHUB_ENV
          echo "VERSION_NAME=1.$((GITHUB_RUN_NUMBER / 100)).$((GITHUB_RUN_NUMBER % 100))" >> $GITHUB_ENV
      - name: Build web (native build – root base)
        run: npm run build
        env:
          VITE_BASE: /
          VITE_PUBLIC_URL: https://products.arounidea.com/dong/
          VITE_RT_URL: ${{ vars.RT_URL }}
          VITE_APP_VERSION: ${{ env.VERSION_NAME }}
          # Real Tapsell zone ids come from repo secrets; without them Tapsell TEST zones are used.
          VITE_TAPSELL_BANNER_ZONE: ${{ secrets.TAPSELL_BANNER_ZONE }}
          VITE_TAPSELL_INTERSTITIAL_ZONE: ${{ secrets.TAPSELL_INTERSTITIAL_ZONE }}
      - name: Capacitor sync
        run: npx cap sync android
        working-directory: apps/web
      # Firebase config for real push notifications (optional). Without it the app builds fine, just no push.
      - name: Firebase google-services.json
        working-directory: apps/web/android/app
        env:
          GS_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GS_JSON" ]; then
            if echo "$GS_JSON" | head -c1 | grep -q '{'; then printf '%s' "$GS_JSON" > google-services.json; else echo "$GS_JSON" | base64 -d > google-services.json; fi
            echo "PUSH=فعال (Firebase)" >> $GITHUB_ENV
          else
            echo "PUSH=غیرفعال (GOOGLE_SERVICES_JSON تنظیم نشده)" >> $GITHUB_ENV
          fi

      # Signing: uses repo secrets if present (Play Store), otherwise a stable debug-style key
      - name: Prepare keystore
        working-directory: apps/web/android
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > release.keystore
            echo "KS_PASS=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASS=${{ secrets.ANDROID_KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            keytool -genkeypair -v -keystore release.keystore -alias dong -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass dong-dev-pass -keypass dong-dev-pass -dname "CN=Dong, O=Dong, C=IR"
            echo "KS_PASS=dong-dev-pass" >> $GITHUB_ENV
            echo "KEY_ALIAS=dong" >> $GITHUB_ENV
            echo "KEY_PASS=dong-dev-pass" >> $GITHUB_ENV
          fi
      - name: Build release APK + AAB
        working-directory: apps/web/android
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease bundleRelease --no-daemon \
            -PDONG_KEYSTORE=$PWD/release.keystore -PDONG_KS_PASS=$KS_PASS -PDONG_KEY_ALIAS=$KEY_ALIAS -PDONG_KEY_PASS=$KEY_PASS \
            -PDONG_VERSION_CODE=$VERSION_CODE -PDONG_VERSION_NAME=$VERSION_NAME \
            -PTAPSELL_APP_ID="${{ secrets.TAPSELL_APP_ID || '76798342-99a7-4a5f-bf5a-60a088d5dcfb' }}" 2>&1 | tee gradle.log || {
              # surface the real error as annotations (readable via the API even when log download is blocked)
              grep -nE "^e: |error:|What went wrong|Duplicate class|Execution failed|Could not|AAPT|Manifest merger" -A3 gradle.log | head -60 | while IFS= read -r l; do echo "::error::$l"; done
              exit 1
            }
          echo "SIGNING=$([ -n '${{ secrets.ANDROID_KEYSTORE_B64 }}' ] && echo 'کلید آپلود شما (Play-ready)' || echo 'کلید موقت (فقط تست — برای Play باید secrets را تنظیم کنید)')" >> $GITHUB_ENV
          echo "ADS=$([ -n '${{ secrets.TAPSELL_APP_ID }}' ] && echo 'تپسل واقعی' || echo 'تبلیغات تستی تپسل')" >> $GITHUB_ENV
          cp app/build/outputs/apk/release/app-release.apk "../../../Dong-${VERSION_NAME}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "../../../Dong-${VERSION_NAME}.aab"

      - uses: actions/upload-artifact@v4
        with:
          name: dong-android
          path: |
            Dong-*.apk
            Dong-*.aab

      # ---- publish to the owner's own host: orphan branch `apk-release` → Plesk deploys it to /dong/apk ----
      - name: Publish APK to apk-release branch (served from products.arounidea.com/dong/apk/)
        # Only for real releases: manual run, or a commit message containing [apk] — keeps the branch small
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[apk]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          rm -rf /tmp/apk
          # linear history (Plesk auto-deploy needs fast-forward pulls); only the newest APK is kept in the tree
          git clone -q --depth 1 --branch apk-release "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/apk 2>/dev/null \
            || { mkdir -p /tmp/apk && git -C /tmp/apk init -q -b apk-release; }
          cd /tmp/apk && rm -f Dong-*.apk
          cp "$GITHUB_WORKSPACE/Dong-${VERSION_NAME}.apk" .
          cat > latest.json <<EOF
          {"name":"دُنگ","version":"${VERSION_NAME}","versionCode":${VERSION_CODE},"file":"Dong-${VERSION_NAME}.apk","url":"https://products.arounidea.com/dong/apk/Dong-${VERSION_NAME}.apk","date":"$(date -u +%Y-%m-%dT%H:%M:%SZ)","commit":"${GITHUB_SHA::7}","signing":"$([ -n "${{ secrets.ANDROID_KEYSTORE_B64 }}" ] && echo upload-key || echo temporary)"}
          EOF
          cat > .htaccess <<'EOF'
          Options -Indexes
          AddType application/vnd.android.package-archive .apk
          <IfModule mod_headers.c>
            <FilesMatch "\.apk$">
              Header set Content-Disposition "attachment"
              Header set Cache-Control "public, max-age=3600"
            </FilesMatch>
            <FilesMatch "^latest\.json$">
              Header set Cache-Control "no-cache, must-revalidate"
              Header set Access-Control-Allow-Origin "*"
            </FilesMatch>
          </IfModule>
          EOF
          cat > index.html <<EOF
          <!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دانلود دُنگ ${VERSION_NAME}</title>
          <body style="font-family:system-ui;margin:0;min-height:100dvh;display:grid;place-items:center;background:#f7f9fa;color:#1e1b18"><div style="text-align:center;padding:32px"><h1 style="margin:0 0 8px">دُنگ</h1><p style="color:#6b6560;margin:0 0 24px">نسخه ${VERSION_NAME}</p><a href="Dong-${VERSION_NAME}.apk" style="display:inline-block;background:linear-gradient(135deg,#0fb88a,#0891b2);color:#fff;text-decoration:none;font-weight:800;padding:14px 28px;border-radius:16px">دانلود اپ اندروید</a></div></body></html>
          EOF
          git config user.name "dong-bot" && git config user.email "bot@dong.local"
          git add -A && git commit -qm "Dong ${VERSION_NAME} (${GITHUB_SHA::7})"
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:apk-release

      - name: Clean previous release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for a in $(gh release view apk-latest --json assets --jq '.assets[].name' 2>/dev/null); do gh release delete-asset apk-latest "$a" -y || true; done
      - name: Publish "latest" release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: دُنگ ${{ env.VERSION_NAME }}
          body: |
            `Dong-${{ env.VERSION_NAME }}.apk` — نصب مستقیم روی اندروید (و برای کافه‌بازار/مایکت). `Dong-${{ env.VERSION_NAME }}.aab` — برای Google Play.
            نسخه وب: https://products.arounidea.com/dong/
          prerelease: false
          files: |
            Dong-${{ env.VERSION_NAME }}.apk
            Dong-${{ env.VERSION_NAME }}.aab
