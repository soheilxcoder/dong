    <!-- Pre-React splash: shown instantly from the HTML itself, removed by React once the app has mounted -->
    <style>
      #boot{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:#053a35 url(./icons/splash-full.webp) center/cover no-repeat;font-family:Vazirmatn,system-ui,sans-serif;transition:opacity .35s}
      #boot.hide{opacity:0;pointer-events:none}
      #boot .w{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;padding-bottom:18vh;box-sizing:border-box}@media (orientation:landscape){#boot{background-size:contain}}#boot .en{position:absolute;bottom:max(28px,env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:#fff;opacity:.9;font-weight:800;letter-spacing:.35em;font-size:14px}
      #boot img,#boot h1,#boot p,#boot .en{display:none}
      #boot h1{color:#fff;font-size:clamp(56px,17vw,90px);font-weight:900;margin:6px 0 0;line-height:1.05;text-shadow:0 3px 20px rgba(0,0,0,.55),0 0 46px rgba(255,214,120,.45)}
      #boot p{display:inline-block;color:#fff;font-size:17px;font-weight:800;margin:10px 0 0;padding:8px 22px;border-radius:999px;background:rgba(3,30,28,.55);box-shadow:0 0 0 1px rgba(255,255,255,.18) inset}
      #boot .off{display:none;margin-top:28px;color:#fff;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:12px 18px;font-size:14px;max-width:80vw;text-align:center;line-height:1.8}
      #boot.offline .off{display:block}
    </style>
    <div id="boot"><div class="w">
      <div class="off">📶 اینترنت وصل نیست<br><small>برای ورود به دُنگ اتصال اینترنت را وصل کن؛ خودکار ادامه می‌دهیم.</small></div></div><div class="en">DONG</div></div>
    <script>(function(){var b=document.getElementById('boot');b.dataset.at=Date.now();function u(){if(!navigator.onLine)b.classList.add('offline');else b.classList.remove('offline')}u();addEventListener('online',u);addEventListener('offline',u);})();</script>
    <div id="root"></div>
