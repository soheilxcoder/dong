services:
  dong:
    build: .
    image: dong:latest
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:4000/}
      FIREBASE_SERVICE_ACCOUNT: ${FIREBASE_SERVICE_ACCOUNT:-/data/firebase-service-account.json}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
    volumes:
      - dong-data:/data      # database + receipt images — back this up
volumes:
  dong-data:
